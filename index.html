}

p,h1,h2,h3,h4,li,blockquote{

}

a,button{

}

/* --- Akışkan, kesintisiz zeminler: her bölüm bir öncekine eriyor --- */

.flow-hero{
  background:linear-gradient(155deg,#071A36 0%,#0A1931 34%,#123E2E 72%,#1E623E 100%)
}

.flow-football{
  background:linear-gradient(180deg,#1E623E 0%,#DFF4E3 14%,#E6F7E8 42%,#D4EEDD 82%,#DDF3F8 100%)
}

.flow-swim{
  background:linear-gradient(180deg,#DDF3F8 0%,#D8F0F7 28%,#D0EAF5 68%,#FFF0E0 100%)
}

.flow-fitness{
  background:linear-gradient(180deg,#FFF0E0 0%,#FFEEDA 38%,#FFE4CC 78%,#EAF5EF 100%)
}

.flow-bridge{
  background:linear-gradient(180deg,#EAF5EF 0%,#E3F0E8 45%,#E7F0E7 70%,#F3F0E3 100%)
}

.flow-packages{
  background:linear-gradient(180deg,#F3F0E3 0%,#EAF4EE 30%,#DFF0E6 72%,#F6F0E3 100%)
}

.flow-end{
  background:linear-gradient(180deg,#F6F0E3 0%,#F2EEE2 34%,#E9EEF4 78%,#E4EAF2 100%)
}

.flow-section{
  position:relative
}

.glass{
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.78);
  box-shadow:0 18px 42px rgba(10,25,49,.09)
}

.glass-soft{
  background:rgba(255,255,255,.58);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 12px 30px rgba(10,25,49,.07)
}

.glass-dark{
  background:rgba(255,255,255,.10);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.20);
  box-shadow:0 18px 42px rgba(0,0,0,.18)
}

/* Hafif sportif dokular — yazıyı kapatmayacak kadar silik */

.hero-grid{
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:44px 44px
}

.pitch-lines{
  background-image:linear-gradient(rgba(22,163,74,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(22,163,74,.10) 1px,transparent 1px);
  background-size:52px 52px
}

.pitch-circle{
  border:1.5px solid rgba(22,163,74,.16);
  border-radius:9999px
}

.water-waves{
  background-image:radial-gradient(ellipse 90px 18px at 20% 30%,rgba(14,116,144,.10),transparent 70%),radial-gradient(ellipse 110px 20px at 75% 55%,rgba(14,116,144,.10),transparent 70%),radial-gradient(ellipse 80px 16px at 45% 82%,rgba(14,116,144,.08),transparent 70%)
}

.energy-lines{
  background-image:repeating-linear-gradient(115deg,rgba(249,115,22,.07) 0 2px,transparent 2px 18px)
}

.dot-grid{
  background-image:radial-gradient(rgba(10,25,49,.14) 1.5px,transparent 1.5px);
  background-size:18px 18px
}

.dot-grid-light{
  background-image:radial-gradient(rgba(255,255,255,.18) 1.5px,transparent 1.5px);
  background-size:18px 18px
}

.card-shadow{
  box-shadow:0 18px 45px rgba(10,25,49,.10)
}

.soft-shadow{
  box-shadow:0 10px 30px rgba(10,25,49,.08)
}

.reveal{
  animation:rise .7s ease both
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(14px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-7px)
  }
}

.floaty{
  animation:floaty 3.4s ease-in-out infinite
}

.marquee-track{
  display:flex;
  gap:12px;
  width:-moz-max-content;
  width:max-content;
  animation:marquee 24s linear infinite
}

@keyframes marquee{
  to{
    transform:translateX(-50%)
  }
}

.testimonial-track{
  display:flex;
  width:-moz-max-content;
  width:max-content;
  animation:testimonial-scroll 72s linear infinite;
  will-change:transform
}

.testimonial-shell:hover .testimonial-track,.testimonial-shell:focus-within .testimonial-track{
  animation-play-state:paused
}

@keyframes testimonial-scroll{
  to{
    transform:translateX(-50%)
  }
}

/* Mobil ferahlık: 48px dokunma hedefi, taşmayan tipografi, yumuşak açılan paneller */

.touch-target{
  min-height:48px
}

.mobile-menu{
  transition:max-height .35s ease,opacity .3s ease
}

.faq-panel{
  transition:grid-template-rows .35s ease,opacity .3s ease
}

@media (max-width:640px){
  body{
    font-size:15px;
    line-height:1.6
  }

  .floaty{
    animation:none
  }

  .marquee-track{
    animation-duration:30s
  }
}

@media (prefers-reduced-motion:reduce){
  .floaty,.marquee-track,.reveal,.testimonial-track{
    animation:none
  }

    scroll-behavior:auto
  }
}
